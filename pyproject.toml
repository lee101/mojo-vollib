[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-vollib"
version = "0.1.0"
description = "Black-Scholes pricing and Greeks backed by Mojo"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["cffi", "numpy"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
